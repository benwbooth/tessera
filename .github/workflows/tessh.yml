# tessh as one file per platform, nothing to install first, with its own
# CPython and uv inside: Linux on x86_64 and aarch64 (flake.nix:
# tessh-static-musl, which runs on any distribution, NixOS and bare
# containers included; tessh-static-gnu, for glibc systems and manylinux
# wheels), macOS on Apple Silicon and Intel (scripts/tessh-static-macos.sh).
# No Windows build: tessh is built on Unix processes, signals and terminals
# (WSL runs the Linux one).
#
# Run by hand (Actions > tessh > Run workflow): the files go on the release
# named by `tag` (default tessh-dev, a pre-release; replaced each run). The
# release workflow calls it, its files going on the version's release.
name: tessh

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release to put the files on (made if missing)'
        required: false
        default: 'tessh-dev'
  workflow_call:
    inputs:
      tag:
        description: 'Release to put the files on ("" to keep them as artifacts only)'
        type: string
        required: false
        default: ''

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: cachix/install-nix-action@v31
      - name: nix build .#tessh-static-musl .#tessh-static-gnu
        run: |
          mkdir -p dist
          for l in musl gnu; do
            nix build -L ".#tessh-static-$l" -o "result-$l"
            install -m755 "result-$l/bin/tessh" "dist/tessh-${{ matrix.arch }}-linux-$l"
          done
          file dist/*
          ls -la dist
      - name: They run (glibc's here; musl's here and in Alpine)
        run: |
          d=dist/tessh-${{ matrix.arch }}-linux
          time "$d-gnu" -c 'echo tessh runs on glibc'
          time "$d-musl" -c 'echo tessh runs on musl'
          docker run --rm -v "$PWD/$d-musl:/tessh:ro" alpine:latest /tessh -c 'echo tessh runs on musl in Alpine'
      - uses: actions/upload-artifact@v4
        with:
          name: tessh-${{ matrix.arch }}-linux
          path: dist/tessh-*-linux-*

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: aarch64
          - runner: macos-15-intel
            arch: x86_64
    runs-on: ${{ matrix.runner }}
    env:
      # (Runs on macOS 11 and later; it links only the system's libraries.)
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: zstd
        run: command -v zstd || brew install zstd
      - name: scripts/tessh-static-macos.sh
        run: scripts/tessh-static-macos.sh
      - name: It runs
        run: |
          f=dist/tessh-${{ matrix.arch }}-macos
          file "$f"
          otool -L "$f"
          "$f" -c 'echo tessh runs'
      - uses: actions/upload-artifact@v4
        with:
          name: tessh-${{ matrix.arch }}-macos
          path: dist/tessh-*-macos

  publish:
    if: inputs.tag != ''
    needs: [linux, macos]
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: tessh-*
          path: dist
          merge-multiple: true
      - name: Put them on the release
        run: |
          ls -la dist
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [ "$TAG" = tessh-dev ]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --prerelease --title "tessh (dev builds)" \
                --notes "tessh as one file per platform, built from the latest commit this was run on."
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --generate-notes
            fi
          fi
          gh release upload "$TAG" dist/* --clobber
          if [ "$TAG" = tessh-dev ]; then
            gh release edit "$TAG" --notes "tessh as one file per platform, built from $GITHUB_SHA."
          fi
