[package]
name = "tessera"
version = "0.3.1"
edition = "2021"
description = "A terminal in the spirit of iTerm2 for Linux, macOS and Windows (Rust + cxx-qt + libghostty-vt)"
license = "MIT"

[[bin]]
name = "tessera"
path = "src/main.rs"

# tesserad, the backend (shells, kernels, cells, Nix), is its own crate: no
# Qt, so it builds static. `cargo build` here builds both.
[workspace]
members = [".", "tesserad", "tessh", "tree-sitter-tessh"]
default-members = [".", "tesserad"]

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libghostty-vt = "0.2.2"
libloading = "0.9.1"
miniz_oxide = "0.9.1"
hmac = "0.12"
sha2 = "0.10"
portable-pty = "0.9"
pulldown-cmark = { version = "0.13.6", default-features = false, features = ["html"] }
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
streaming-iterator = "0.1.9"
toml_edit = "0.25.19"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-c = "0.24.2"
tree-sitter-cpp = "0.23.4"
tree-sitter-css = "0.25.0"
tree-sitter-go = "0.25.0"
tree-sitter-html = "0.23.2"
tree-sitter-java = "0.23.5"
tree-sitter-javascript = "0.25.0"
tree-sitter-json = "0.24.8"
tree-sitter-language = "0.1.9"
tree-sitter-lua = "0.5.0"
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = "0.23.1"
tree-sitter-rust = "0.24.2"
tree-sitter-sequel = "0.3.13"
tree-sitter-tessh = { path = "tree-sitter-tessh" }
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = "0.23.2"
tree-sitter-yaml = "0.7.2"
ureq = { version = "3", features = ["json"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
csv = "1.4.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
# Ghostty's library as a DLL on Windows: Zig builds the static one against
# the static C runtime (/MT), which can't link with Qt's /MD.
libghostty-vt-sys = { version = "0.2.2", features = ["link-dynamic"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cxx-qt-build = "0.10"

# Same idea as Almanac: one optimized, incremental profile for everything.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
