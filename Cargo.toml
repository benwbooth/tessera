[package]
name = "tessera"
version = "0.1.0"
edition = "2021"
description = "A terminal in the spirit of iTerm2 for Linux, macOS and Windows (Rust + cxx-qt + libghostty-vt)"
license = "MIT"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
libghostty-vt = "0.2.2"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[build-dependencies]
cxx-qt-build = "0.10"

# Same idea as Almanac: one optimized, incremental profile for everything.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
