[package]
name = "tessera"
version = "0.1.0"
edition = "2021"
description = "A terminal in the spirit of iTerm2 for Linux, macOS and Windows (Rust + cxx-qt + libghostty-vt)"
license = "MIT"

[[bin]]
name = "tessera"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
base64 = "0.23.1"
cxx = "1.0"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_full"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
libghostty-vt = "0.2.2"
miniz_oxide = "0.9.1"
portable-pty = "0.9"
regex = "1.13.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shell-words = "1.1.1"
streaming-iterator = "0.1.9"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-javascript = "0.25.0"
tree-sitter-python = "0.25.0"
ureq = { version = "3", features = ["json"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
uds_windows = "1"
# Ghostty's library as a DLL on Windows: Zig builds the static one against
# the static C runtime (/MT), which can't link with Qt's /MD.
libghostty-vt-sys = { version = "0.2.2", features = ["link-dynamic"] }
windows-sys = { version = "0.59", features = ["Win32_System_Threading", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
cxx-qt-build = "0.10"

# Same idea as Almanac: one optimized, incremental profile for everything.
[profile.dev]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
incremental = true
