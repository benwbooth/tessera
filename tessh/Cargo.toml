[package]
name = "tessh"
version = "0.1.0"
edition = "2021"
description = "tessh: a shell language that compiles to Python, with indentation for structure, infix and shell operators, and hygienic macros"
license = "MIT"

[[bin]]
name = "tessh"
path = "src/main.rs"

[features]
# The standalone build (flake: tessh-static): Python's stable ABI, so the
# one binary runs on whichever CPython uv provides (3.12 on), and acting as
# that Python's `python3` for uv and sys.executable.
standalone = ["pyo3/abi3-py312"]
# The viewer's own grammars for the bigger languages (SQL alone is 10 MB):
# without them those are highlighted by bat's syntaxes or the Helix grammar
# fetched once, as every other language is. The single-file builds leave
# them out (--no-default-features).
default = ["builtin-grammars"]
builtin-grammars = ["dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-css", "dep:tree-sitter-go", "dep:tree-sitter-html", "dep:tree-sitter-java", "dep:tree-sitter-javascript", "dep:tree-sitter-lua", "dep:tree-sitter-ruby", "dep:tree-sitter-rust", "dep:tree-sitter-sequel", "dep:tree-sitter-typescript"]

[dependencies]
chumsky = "1.0.0-alpha.8"
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
# The terminal editor: reedline, with two small changes (vendor/README.md).
reedline = { path = "vendor/reedline" }
crossterm = "0.29"
nu-ansi-term = "0.50"
unicode-width = "0.2"
# Highlighting, as Tessera's.
tree-sitter-tessh = { path = "../tree-sitter-tessh" }
# The Advanced guide's bash examples, colored (the version Tessera uses).
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
glob = "0.3"
serde_json = "1"
base64 = "0.23"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
async-trait = "0.1"
# The file viewer (view, a file run, cat at a tty): code highlighted with
# the grammars Tessera's editor has built in (src/syntax.rs, same versions),
# pictures decoded as Tessera's are (src/images.rs) and sent as kitty,
# iTerm2 or sixel graphics, tables, YAML, archives' lists and PDFs' text.
tree-sitter-c = { version = "0.24.2", optional = true }
tree-sitter-cpp = { version = "0.23.4", optional = true }
tree-sitter-css = { version = "0.25.0", optional = true }
tree-sitter-go = { version = "0.25.0", optional = true }
tree-sitter-html = { version = "0.23.2", optional = true }
tree-sitter-java = { version = "0.23.5", optional = true }
tree-sitter-javascript = { version = "0.25.0", optional = true }
tree-sitter-json = "0.24.8"
tree-sitter-lua = { version = "0.5.0", optional = true }
tree-sitter-md = "0.5.4"
tree-sitter-python = "0.25.0"
tree-sitter-ruby = { version = "0.23.1", optional = true }
tree-sitter-rust = { version = "0.24.2", optional = true }
tree-sitter-sequel = { version = "0.3.13", optional = true }
tree-sitter-toml-ng = "0.7.0"
tree-sitter-typescript = { version = "0.23.2", optional = true }
tree-sitter-yaml = "0.7.2"
# Helix's ~250 grammars, loaded and fetched as Tessera does it (src/grammars.rs
# and src/detect.rs, shared: same files, same runtime folder, same cache).
libloading = "0.9.1"
tree-sitter-language = "0.1.9"
streaming-iterator = "0.1.9"
ureq = { version = "3", features = ["json"] }
hyperpolyglot = "0.1.7"
magika = "=2.0.0-rc.0"
# (Every other language: bat's ~200 syntaxes, as Grove's Quick Look has them.)
two-face = { version = "0.5", default-features = false, features = ["syntect-fancy"] }
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "regex-fancy", "parsing"] }
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp"] }
icy_sixel = "0.7.0"
csv = "1.4.0"
serde_yaml = "0.8"
serde = "1"
# (An archive's list: its headers only, so no codecs for zip's members.)
zip = { version = "9.8.2", default-features = false }
tar = "0.4"
flate2 = "1"
ruzstd = "0.9.1"
lzma-rs = "0.3.0"
bzip2 = "0.6.1"
# (A PDF's text when poppler's pdftotext isn't installed.)
pdf-extract = "0.12.1"
