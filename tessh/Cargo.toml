[package]
name = "tessh"
version = "0.1.0"
edition = "2021"
description = "tessh: a shell language that compiles to Python, with indentation for structure, infix and shell operators, and hygienic macros"
license = "MIT"

[[bin]]
name = "tessh"
path = "src/main.rs"

[features]
# The standalone build (flake: tessh-static): Python's stable ABI, so the
# one binary runs on whichever CPython uv provides (3.12 on), and acting as
# that Python's `python3` for uv and sys.executable.
standalone = ["pyo3/abi3-py312"]

[dependencies]
chumsky = "1.0.0-alpha.8"
pyo3 = { version = "0.30.1", features = ["auto-initialize"] }
# The terminal editor: reedline, with two small changes (vendor/README.md).
reedline = { path = "vendor/reedline" }
crossterm = "0.29"
nu-ansi-term = "0.50"
unicode-width = "0.2"
# Highlighting, as Tessera's.
tree-sitter-tessh = { path = "../tree-sitter-tessh" }
# The Advanced guide's bash examples, colored (the version Tessera uses).
tree-sitter = "0.27"
tree-sitter-bash = "0.25.1"
zeromq = { version = "0.7", default-features = false, features = ["tokio-runtime", "tcp-transport"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
toml = "1"
glob = "0.3"
serde_json = "1"
base64 = "0.23"
libc = "0.2"
hmac = "0.12"
sha2 = "0.10"
hex = "0.4"
uuid = { version = "1", features = ["v4"] }
bytes = "1"
async-trait = "0.1"
