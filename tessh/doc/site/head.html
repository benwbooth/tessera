<!-- The Guide tab's style and scripts, as Tessera renders tessh's guides
     (qml/GuidePage.qml css(), its tab and contents scripts), for the site:
     scripts/tessh-docs-site.sh. Taken from a page Tessera wrote. -->
<style id='tessera-theme'>body{background:#000000;color:#d3d6db;font:14px/1.6 'Noto Sans','Segoe UI',system-ui,sans-serif;margin:0;display:flex;height:100vh;overflow:hidden}a{color:#5eb0ff}h1,h2{border-bottom:1px solid #191a1a;padding-bottom:.25em}h1{font-size:1.8em}h2{font-size:1.4em}h1,h2,h3,h4{margin:1.1em 0 .5em;line-height:1.25}code{font-family:monospace,monospace;font-size:.88em;background:#151516;padding:.15em .35em;border-radius:5px}pre{background:#151516;padding:10px 12px;border-radius:7px;overflow:auto}pre code{background:none;padding:0}table{border-collapse:collapse}th,td{border:1px solid #191a1a;padding:5px 10px}th{background:#151516}::-webkit-scrollbar{width:9px;height:9px}::-webkit-scrollbar-thumb{background:#191a1a;border-radius:5px}nav{width:230px;flex:none;overflow:auto;padding:14px 10px 30px 14px;border-right:1px solid #191a1a;font-size:13px;line-height:1.35}nav .title{font-weight:bold;font-size:15px;margin-bottom:10px;color:#d3d6db}nav a{display:block;color:#d3d6db;text-decoration:none;padding:2px 6px;border-radius:5px}nav a:hover{background:#151516}nav a.part{font-weight:bold;margin-top:10px;color:#d3d6db}nav .topics a{padding-left:14px;color:#7a7c7f}main{flex:1;overflow:auto;padding:16px 28px 60px}main>*{max-width:860px}main>*{content-visibility:auto;contain-intrinsic-size:auto 80px}pre.tessh{border-left:3px solid #5eb0ff}#navsplit{flex:none;width:6px;margin-left:-3px;margin-right:-3px;cursor:col-resize;z-index:2}#navsplit:hover,#navsplit.on{background:#5eb0ff;opacity:.5}.ex-tabs{margin:.9em 0;position:relative}.ex-tabs>input{position:absolute;opacity:0;pointer-events:none}.ex-tabs>label{display:inline-block;padding:3px 14px;margin-right:3px;border-radius:7px 7px 0 0;font-size:12px;cursor:pointer;color:#7a7c7f}.ex-tabs>label:hover{color:#d3d6db}.ex-tabs>input:checked+label{background:#151516;color:#d3d6db;font-weight:bold}.ex-pane{display:none}.ex-r-bash:checked~.ex-bash,.ex-r-tessh:checked~.ex-tessh{display:block}.ex-pane>pre:first-child{margin-top:0;border-top-left-radius:0}pre.output{background:transparent;border:1px dashed #191a1a;color:#7a7c7f;margin-top:-6px}pre.output::before{content:'output';display:block;font-size:10px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}.t-keyword{color:#d38cff}.t-string{color:#7ee081}.t-number,.t-constant,.t-attribute{color:#ffd166}.t-function{color:#5eb0ff}.t-comment{color:#555b64;font-style:italic}.t-operator,.t-property{color:#4fd6d6}.t-variable{color:#ff5f6d}.t-punctuation{color:#7a7c7f}.t-embedded{color:#e3adff;font-weight:bold}.t-escape{color:#4fd6d6}.t-type,.t-constructor,.t-tag,.t-label,.t-namespace,.t-module{color:#ffd166}main li{margin:.5em 0}.hit{color:#7a7c7f;font-size:13px}.note{color:#7a7c7f}img{max-width:100%}blockquote{margin:.6em 0;padding:.2em 1em;border-left:3px solid #191a1a;color:#7a7c7f}main>blockquote:first-child{border-left-color:#5eb0ff;font-size:12.5px}.msg{margin:40px auto;max-width:520px;color:#7a7c7f;font-size:15px;text-align:center}h1:target,h2:target,h3:target{color:#5eb0ff}nav .guides{display:flex;gap:6px;margin:0 0 12px}nav .guides a{flex:1;text-align:center;border:1px solid #191a1a;padding:4px 6px}nav .guides a.on{background:#151516;font-weight:bold}nav .home{font-size:12px;margin:0 0 10px}</style>
<script>document.addEventListener('click',e=>{const a=e.target.closest('a[href^="#"]');if(!a)return;const t=document.getElementById(decodeURIComponent(a.getAttribute('href').slice(1)));if(t){e.preventDefault();t.scrollIntoView({block:'start'});history.replaceState(null,'',a.getAttribute('href'))}})</script>
<script>document.addEventListener('DOMContentLoaded',()=>{const nav=document.querySelector('nav');if(!nav)return;const sp=document.createElement('div');sp.id='navsplit';sp.title='Drag to resize the contents';nav.after(sp);sp.addEventListener('mousedown',ev=>{if(ev.button!==0)return;ev.preventDefault();const x0=ev.clientX,w0=nav.getBoundingClientRect().width;sp.classList.add('on');document.body.style.cursor='col-resize';document.body.style.userSelect='none';const mv=e=>{nav.style.width=Math.max(140,Math.min(700,w0+e.clientX-x0))+'px'};const up=()=>{removeEventListener('mousemove',mv);removeEventListener('mouseup',up);sp.classList.remove('on');document.body.style.cursor='';document.body.style.userSelect='';console.log('tessera-navw:'+Math.round(nav.getBoundingClientRect().width))};addEventListener('mousemove',mv);addEventListener('mouseup',up)});sp.addEventListener('dblclick',()=>{nav.style.width='230px';console.log('tessera-navw:230')})})</script>
<script>let exY=null;document.addEventListener('pointerdown',e=>{const l=e.target.closest('.ex-tabs>label');exY=l?l.parentElement.getBoundingClientRect().top:null},true);document.addEventListener('change',e=>{const t=e.target;if(!t.matches('.ex-tabs>input'))return;const box=t.closest('.ex-tabs'),y=exY!==null?exY:box.getBoundingClientRect().top;exY=null;document.querySelectorAll('.ex-tabs>input.'+t.className).forEach(i=>{if(i!==t)i.checked=true});let sc=box.parentElement;while(sc&&!(sc.scrollHeight>sc.clientHeight&&/auto|scroll/.test(getComputedStyle(sc).overflowY)))sc=sc.parentElement;(sc||document.scrollingElement).scrollTop+=box.getBoundingClientRect().top-y;console.log('tessera-tabs:'+t.className)})</script>
